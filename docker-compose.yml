version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: hostel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hostel_db
    ports:
      - "3306:3306"
    volumes:
      - hostel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hostel_mysql_data:
